<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tegel - A strategic block shooting puzzle game. Match connected blocks to clear the grid!">
    <meta name="theme-color" content="#667eea">
    <title>Tegel</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">

    <!-- iOS Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Tegel">
    <link rel="apple-touch-icon" href="./icon-192.svg">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./icon-192.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: auto;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 100%;
            overflow-x: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .version {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 0.7em;
            color: #999;
            font-weight: normal;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .score {
            font-size: 1.5em;
            color: #667eea;
            font-weight: bold;
        }

        .high-score {
            font-size: 1em;
            color: #999;
            font-weight: normal;
            margin-left: 15px;
        }

        .canvas-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            overflow: visible;
        }

        canvas {
            display: block;
            border: 3px solid #333;
            border-radius: 10px;
            cursor: pointer;
            background: #f5f5f5;
            width: 100%;
            height: auto;
            max-width: 100%;
            touch-action: none;
        }

        .controls {
            margin-top: 20px;
            text-align: center;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
            font-weight: bold;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .config {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .config-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .config-item label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .config-item input {
            width: 80px;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 5px;
            text-align: center;
            font-size: 1em;
        }

        .win-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            z-index: 1000;
            display: none;
        }

        .win-message.show {
            display: block;
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes popIn {
            0% {
                transform: translate(-50%, -50%) scale(0);
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .win-message h2 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .win-message p {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 30px;
        }

        .settings-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .settings-popup.show {
            display: flex;
        }

        .settings-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
        }

        .settings-content h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .settings-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .settings-buttons button {
            flex: 1;
        }

        /* Dark mode styles */
        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        body.dark-mode .game-container {
            background: #0f3460;
            color: #e0e0e0;
        }

        body.dark-mode h1 {
            color: #e0e0e0;
        }

        body.dark-mode .score {
            color: #7c9fff;
        }

        body.dark-mode .high-score {
            color: #aaa;
        }

        body.dark-mode canvas {
            background: #1a1a2e;
            border-color: #555;
        }

        body.dark-mode .settings-content {
            background: #0f3460;
            color: #e0e0e0;
        }

        body.dark-mode .settings-content h2 {
            color: #7c9fff;
        }

        body.dark-mode .config-item label {
            color: #aaa;
        }

        body.dark-mode .config-item input {
            background: #1a1a2e;
            color: #e0e0e0;
            border-color: #555;
        }

        body.dark-mode .win-message {
            background: #0f3460;
            color: #e0e0e0;
        }

        body.dark-mode .win-message h2 {
            color: #7c9fff;
        }

        body.dark-mode .win-message p {
            color: #e0e0e0;
        }

        /* Update notification */
        .update-notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #667eea;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: none;
            align-items: center;
            gap: 15px;
            z-index: 3000;
            max-width: 90%;
            animation: slideUp 0.3s ease-out;
        }

        .update-notification.show {
            display: flex;
        }

        @keyframes slideUp {
            from {
                transform: translateX(-50%) translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        .update-notification button {
            background: white;
            color: #667eea;
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .update-notification button:hover {
            background: #f0f0f0;
        }

        .update-notification .dismiss {
            background: transparent;
            color: white;
            text-decoration: underline;
            padding: 8px 15px;
        }

        .update-notification .dismiss:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        body.dark-mode .update-notification {
            background: #0f3460;
            border: 2px solid #667eea;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            body {
                padding: 10px;
                align-items: flex-start;
            }

            .game-container {
                padding: 15px;
                border-radius: 10px;
            }

            h1 {
                font-size: 1.5em;
            }

            .score {
                font-size: 1.2em;
            }

            .high-score {
                font-size: 0.85em;
                display: block;
                margin-left: 0;
                margin-top: 5px;
            }

            .config {
                gap: 10px;
            }

            .config-item {
                font-size: 0.9em;
            }

            .config-item input {
                width: 60px;
                padding: 6px;
                font-size: 0.9em;
            }

            button {
                padding: 10px 20px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <span class="version">v1.3 (Debug)</span>
            <h1>Tegel</h1>
            <div class="score">
                Score: <span id="scoreValue">0</span>
                <span class="high-score">(Best: <span id="highScoreValue">0</span>)</span>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="controls">
            <button onclick="game.reset()">New Game</button>
            <button onclick="game.toggleSettings()" id="settingsBtn">⚙️ Settings</button>
            <button onclick="game.toggleDarkMode()" id="darkModeBtn">🌙 Dark Mode</button>
            <button onclick="manualUpdateCheck()" id="updateCheckBtn">🔄 Check Updates</button>
        </div>

        <!-- Debug Info -->
        <div style="margin-top: 15px; padding: 10px; background: rgba(0,0,0,0.05); border-radius: 5px; font-size: 0.85em;">
            <div><strong>PWA Status:</strong></div>
            <div id="debugInfo" style="margin-top: 5px; color: #666;">Loading...</div>
        </div>
    </div>

    <div class="win-message" id="winMessage">
        <h2>🎉 You Win! 🎉</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button onclick="game.reset(); document.getElementById('winMessage').classList.remove('show');">Play Again</button>
    </div>

    <div class="settings-popup" id="settingsPopup">
        <div class="settings-content">
            <h2>Settings</h2>
            <div class="settings-grid">
                <div class="config-item">
                    <label>Grid Size (N)</label>
                    <input type="number" id="gridSize" value="9" min="3" max="15">
                </div>
                <div class="config-item">
                    <label>Waiting Blocks (M)</label>
                    <input type="number" id="waitingBlocks" value="2" min="0" max="5">
                </div>
                <div class="config-item">
                    <label>Colors (C)</label>
                    <input type="number" id="colors" value="5" min="2" max="8">
                </div>
                <div class="config-item">
                    <label>Match Size (Y)</label>
                    <input type="number" id="matchSize" value="3" min="2" max="5">
                </div>
            </div>
            <div class="settings-buttons">
                <button onclick="game.saveSettings()">Save & Apply</button>
                <button onclick="game.toggleSettings()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Update Notification -->
    <div class="update-notification" id="updateNotification">
        <span>🎉 New version available!</span>
        <button onclick="updateApp()">Update Now</button>
        <button class="dismiss" onclick="dismissUpdate()">Later</button>
    </div>

    <script>
        class BlockShooterGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');

                // Configuration
                this.config = {
                    N: 9,           // Grid size
                    M: 2,           // Waiting blocks
                    C: 5,           // Number of colors
                    Y: 3            // Match size
                };

                // Visual constants
                this.CELL_SIZE = 40;
                this.BLOCK_MARGIN = 4;

                this.colors = [
                    '#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A',
                    '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2'
                ];

                // Directions: 0=right, 1=down, 2=left, 3=up
                this.directionVectors = [
                    {dx: 1, dy: 0},   // right
                    {dx: 0, dy: 1},   // down
                    {dx: -1, dy: 0},  // left
                    {dx: 0, dy: -1}   // up
                ];

                // Load high score from localStorage
                this.highScore = this.loadHighScore();
                this.updateHighScoreDisplay();

                // Load settings and dark mode preference
                this.loadSettings();
                this.loadDarkMode();

                this.reset();
                this.setupEventListeners();
                this.animate();
            }

            loadHighScore() {
                const saved = localStorage.getItem('blockShooterHighScore');
                return saved ? parseInt(saved) : 0;
            }

            saveHighScore() {
                localStorage.setItem('blockShooterHighScore', this.highScore.toString());
            }

            updateHighScoreDisplay() {
                document.getElementById('highScoreValue').textContent = this.highScore;
            }

            loadSettings() {
                const saved = localStorage.getItem('tegelSettings');
                if (saved) {
                    const settings = JSON.parse(saved);
                    this.config.N = settings.N || 9;
                    this.config.M = settings.M || 2;
                    this.config.C = settings.C || 5;
                    this.config.Y = settings.Y || 3;

                    // Update input fields
                    document.getElementById('gridSize').value = this.config.N;
                    document.getElementById('waitingBlocks').value = this.config.M;
                    document.getElementById('colors').value = this.config.C;
                    document.getElementById('matchSize').value = this.config.Y;
                }
            }

            saveSettings() {
                // Read values from inputs
                const settings = {
                    N: parseInt(document.getElementById('gridSize').value),
                    M: parseInt(document.getElementById('waitingBlocks').value),
                    C: parseInt(document.getElementById('colors').value),
                    Y: parseInt(document.getElementById('matchSize').value)
                };

                // Save to localStorage
                localStorage.setItem('tegelSettings', JSON.stringify(settings));

                // Close popup
                this.toggleSettings();

                // Reset game with new settings
                this.reset();
            }

            toggleSettings() {
                const popup = document.getElementById('settingsPopup');
                popup.classList.toggle('show');
            }

            loadDarkMode() {
                const darkMode = localStorage.getItem('tegelDarkMode') === 'true';
                if (darkMode) {
                    document.body.classList.add('dark-mode');
                    document.getElementById('darkModeBtn').textContent = '☀️ Light Mode';
                }
            }

            toggleDarkMode() {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');

                // Update button text
                document.getElementById('darkModeBtn').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';

                // Save preference
                localStorage.setItem('tegelDarkMode', isDark.toString());
            }

            reset() {
                // Read configuration from inputs
                this.config.N = parseInt(document.getElementById('gridSize').value);
                this.config.M = parseInt(document.getElementById('waitingBlocks').value);
                this.config.C = parseInt(document.getElementById('colors').value);
                this.config.Y = parseInt(document.getElementById('matchSize').value);

                // Calculate canvas size
                const gridSize = this.config.N * this.CELL_SIZE;
                const sideSpace = this.CELL_SIZE * (this.config.M + 1.5); // M waiting + 1 shootable + spacing
                this.canvas.width = gridSize + sideSpace * 2;
                this.canvas.height = gridSize + sideSpace * 2;

                // Calculate offsets for centering
                this.gridOffsetX = sideSpace;
                this.gridOffsetY = sideSpace;

                // Initialize game state
                this.grid = Array(this.config.N).fill(null).map(() => Array(this.config.N).fill(null));
                this.score = 0;
                this.updateScore();

                // Initialize side blocks
                this.initializeSideBlocks();

                // Place initial random blocks
                this.placeInitialBlocks();

                // Animation state
                this.animatingBlocks = [];
                this.movingBlocks = [];

                // Mouse/Touch state
                this.hoveredBlock = null;
                this.activeBlock = null; // Block being pressed (touch)
                this.trajectoryPreview = null; // Preview path for active block
            }

            initializeSideBlocks() {
                this.sideBlocks = {
                    right: [],  // Shoots left (direction 2)
                    down: [],   // Shoots up (direction 3)
                    left: [],   // Shoots right (direction 0)
                    up: []      // Shoots down (direction 1)
                };

                const sideConfigs = [
                    {name: 'right', direction: 2},
                    {name: 'down', direction: 3},
                    {name: 'left', direction: 0},
                    {name: 'up', direction: 1}
                ];

                sideConfigs.forEach(({name, direction}) => {
                    // Create N positions, each with (1 + M) blocks
                    for (let i = 0; i < this.config.N; i++) {
                        const position = [];
                        for (let j = 0; j < 1 + this.config.M; j++) {
                            position.push({
                                color: Math.floor(Math.random() * this.config.C),
                                direction: direction
                            });
                        }
                        this.sideBlocks[name].push(position);
                    }
                });
            }

            placeInitialBlocks() {
                const numBlocks = Math.floor((this.config.N * this.config.N) / 13);
                const availableCells = [];

                // Leave one space from edges (x and y from 1 to N-2)
                for (let y = 1; y < this.config.N - 1; y++) {
                    for (let x = 1; x < this.config.N - 1; x++) {
                        availableCells.push({x, y});
                    }
                }

                for (let i = 0; i < numBlocks; i++) {
                    if (availableCells.length === 0) break;

                    const idx = Math.floor(Math.random() * availableCells.length);
                    const {x, y} = availableCells.splice(idx, 1)[0];

                    // Random color, but NO direction (static blocks)
                    this.grid[y][x] = {
                        color: Math.floor(Math.random() * this.config.C),
                        direction: null  // null means static block
                    };
                }
            }

            setupEventListeners() {
                this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
                this.canvas.addEventListener('click', (e) => this.handleClick(e));

                // Touch events for mobile
                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.handleTouchStart(touch);
                });

                this.canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.handleTouchMove(touch);
                });

                this.canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.handleTouchEnd();
                });

                this.canvas.addEventListener('touchcancel', (e) => {
                    e.preventDefault();
                    this.cancelActiveBlock();
                });
            }

            getMousePos(e) {
                const rect = this.canvas.getBoundingClientRect();
                const scaleX = this.canvas.width / rect.width;
                const scaleY = this.canvas.height / rect.height;

                return {
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY
                };
            }

            getBlockAtMouse(mouseX, mouseY) {
                // Check each side's shootable blocks (depth 0 only)
                const sides = ['left', 'up', 'right', 'down'];

                for (const side of sides) {
                    const positions = this.sideBlocks[side];

                    for (let i = 0; i < positions.length; i++) {
                        // Only check the shootable block (depth 0)
                        const pos = this.getSideBlockPosition(side, i, 0);

                        if (mouseX >= pos.x && mouseX <= pos.x + this.CELL_SIZE &&
                            mouseY >= pos.y && mouseY <= pos.y + this.CELL_SIZE) {
                            return {side, position: i};
                        }
                    }
                }

                return null;
            }

            getSideBlockPosition(side, position, depth) {
                const margin = this.CELL_SIZE * 0.25;

                switch(side) {
                    case 'left':
                        return {
                            x: this.gridOffsetX - this.CELL_SIZE * (depth + 1),
                            y: this.gridOffsetY + position * this.CELL_SIZE
                        };
                    case 'right':
                        return {
                            x: this.gridOffsetX + this.config.N * this.CELL_SIZE + this.CELL_SIZE * depth,
                            y: this.gridOffsetY + position * this.CELL_SIZE
                        };
                    case 'up':
                        return {
                            x: this.gridOffsetX + position * this.CELL_SIZE,
                            y: this.gridOffsetY - this.CELL_SIZE * (depth + 1)
                        };
                    case 'down':
                        return {
                            x: this.gridOffsetX + position * this.CELL_SIZE,
                            y: this.gridOffsetY + this.config.N * this.CELL_SIZE + this.CELL_SIZE * depth
                        };
                }
            }

            handleMouseMove(e) {
                const pos = this.getMousePos(e);
                this.hoveredBlock = this.getBlockAtMouse(pos.x, pos.y);
            }

            handleClick(e) {
                const pos = this.getMousePos(e);
                const block = this.getBlockAtMouse(pos.x, pos.y);

                if (block && this.movingBlocks.length === 0) {
                    // Check if this block will hit anything
                    if (this.willBlockHitAnything(block.side, block.position)) {
                        this.shootBlock(block.side, block.position);
                    }
                }
            }

            handleTouchStart(touch) {
                const pos = this.getMousePos(touch);
                const block = this.getBlockAtMouse(pos.x, pos.y);

                if (block && this.movingBlocks.length === 0) {
                    // Check if this block will hit anything
                    if (this.willBlockHitAnything(block.side, block.position)) {
                        this.activeBlock = block;
                        this.calculateTrajectoryPreview(block.side, block.position);

                        // Haptic feedback - light vibration
                        if (navigator.vibrate) {
                            navigator.vibrate(10);
                        }
                    }
                }
            }

            handleTouchMove(touch) {
                const pos = this.getMousePos(touch);

                // Check if touch moved into grid area - cancel if so
                if (this.isPositionInGrid(pos.x, pos.y)) {
                    this.cancelActiveBlock();
                    return;
                }

                // Update selection if moved to different block
                const block = this.getBlockAtMouse(pos.x, pos.y);
                if (block && this.willBlockHitAnything(block.side, block.position)) {
                    this.activeBlock = block;
                    this.calculateTrajectoryPreview(block.side, block.position);
                } else if (!block) {
                    // Moved off blocks entirely - cancel
                    this.cancelActiveBlock();
                }
            }

            handleTouchEnd() {
                if (this.activeBlock && this.movingBlocks.length === 0) {
                    // Haptic feedback - slightly stronger vibration for shooting
                    if (navigator.vibrate) {
                        navigator.vibrate(20);
                    }

                    this.shootBlock(this.activeBlock.side, this.activeBlock.position);
                }
                this.cancelActiveBlock();
            }

            cancelActiveBlock() {
                this.activeBlock = null;
                this.trajectoryPreview = null;
            }

            isPositionInGrid(x, y) {
                return x >= this.gridOffsetX &&
                       x < this.gridOffsetX + this.config.N * this.CELL_SIZE &&
                       y >= this.gridOffsetY &&
                       y < this.gridOffsetY + this.config.N * this.CELL_SIZE;
            }

            calculateTrajectoryPreview(side, position) {
                // Calculate the path the block will travel
                const startPos = this.getStartPosition(side, position);
                const block = this.sideBlocks[side][position][0];
                const dir = this.directionVectors[block.direction];

                const path = [];
                let x = startPos.x;
                let y = startPos.y;

                while (true) {
                    path.push({x, y});
                    const nextX = x + dir.dx;
                    const nextY = y + dir.dy;

                    // Out of bounds or collision
                    if (nextX < 0 || nextX >= this.config.N ||
                        nextY < 0 || nextY >= this.config.N ||
                        this.grid[nextY][nextX] !== null) {
                        break;
                    }

                    x = nextX;
                    y = nextY;
                }

                this.trajectoryPreview = path;
            }

            willBlockHitAnything(side, position) {
                // Simulate the block's path to see if it hits anything
                const startPos = this.getStartPosition(side, position);
                const block = this.sideBlocks[side][position][0];
                const dir = this.directionVectors[block.direction];

                let x = startPos.x;
                let y = startPos.y;

                while (true) {
                    const nextX = x + dir.dx;
                    const nextY = y + dir.dy;

                    // Out of bounds - won't hit anything
                    if (nextX < 0 || nextX >= this.config.N ||
                        nextY < 0 || nextY >= this.config.N) {
                        return false;
                    }

                    // Found a collision - will hit something
                    if (this.grid[nextY][nextX] !== null) {
                        return true;
                    }

                    x = nextX;
                    y = nextY;
                }
            }

            shootBlock(side, position) {
                const positionBlocks = this.sideBlocks[side][position];
                if (!positionBlocks || positionBlocks.length === 0) return;

                // Take the first block (shootable block)
                const block = positionBlocks.shift();
                const startPos = this.getStartPosition(side, position);

                console.log(`Shooting block from ${side} position ${position}, color ${block.color}, direction ${block.direction}, starting at (${startPos.x}, ${startPos.y})`);

                // Create moving block with animation support
                const movingBlock = {
                    color: block.color,
                    direction: block.direction,
                    x: startPos.x,
                    y: startPos.y,
                    visualX: startPos.x,  // For smooth animation
                    visualY: startPos.y,  // For smooth animation
                    path: [],             // Path to follow
                    pathIndex: 0,
                    speed: 0.2,           // Animation speed
                    moving: true
                };

                this.movingBlocks.push(movingBlock);

                // Add new block to the end of waiting queue
                positionBlocks.push({
                    color: Math.floor(Math.random() * this.config.C),
                    direction: block.direction
                });

                // Calculate path and start animation
                this.calculateBlockPath(movingBlock);
            }

            getStartPosition(side, index) {
                switch(side) {
                    case 'left':
                        return {x: 0, y: index};
                    case 'right':
                        return {x: this.config.N - 1, y: index};
                    case 'up':
                        return {x: index, y: 0};
                    case 'down':
                        return {x: index, y: this.config.N - 1};
                }
            }

            calculateBlockPath(block) {
                // Calculate the full path the block will travel
                const dir = this.directionVectors[block.direction];
                let x = block.x;
                let y = block.y;
                const path = [{x, y}];

                while (true) {
                    const nextX = x + dir.dx;
                    const nextY = y + dir.dy;

                    // Check if out of bounds
                    if (nextX < 0 || nextX >= this.config.N ||
                        nextY < 0 || nextY >= this.config.N) {
                        block.path = path;
                        block.endsAtEdge = true;
                        block.finalX = x;
                        block.finalY = y;

                        // Calculate which side it goes to
                        let side, position;
                        if (x === 0) {
                            side = 'left';
                            position = y;
                        } else if (x === this.config.N - 1) {
                            side = 'right';
                            position = y;
                        } else if (y === 0) {
                            side = 'up';
                            position = x;
                        } else {
                            side = 'down';
                            position = x;
                        }

                        // Add animation path to the side position
                        const sidePos = this.getSideBlockPosition(side, position, 0);
                        const sideCellX = (sidePos.x - this.gridOffsetX) / this.CELL_SIZE;
                        const sideCellY = (sidePos.y - this.gridOffsetY) / this.CELL_SIZE;

                        // Add intermediate points for smooth animation to side
                        const steps = 5;
                        for (let i = 1; i <= steps; i++) {
                            const t = i / steps;
                            path.push({
                                x: x + (sideCellX - x) * t,
                                y: y + (sideCellY - y) * t
                            });
                        }

                        block.destinationSide = side;
                        block.destinationPosition = position;
                        return;
                    }

                    // Check if collision with existing block
                    if (this.grid[nextY][nextX] !== null) {
                        block.path = path;
                        block.endsAtEdge = false;
                        block.finalX = x;
                        block.finalY = y;
                        return;
                    }

                    x = nextX;
                    y = nextY;
                    path.push({x, y});
                }
            }

            moveBlockUntilCollision(block) {
                const dir = this.directionVectors[block.direction];
                let x = block.x;
                let y = block.y;

                // Move until collision or edge
                while (true) {
                    const nextX = x + dir.dx;
                    const nextY = y + dir.dy;

                    // Check if out of bounds
                    if (nextX < 0 || nextX >= this.config.N ||
                        nextY < 0 || nextY >= this.config.N) {
                        // Block goes to opposite side
                        console.log(`Block reached edge at (${x}, ${y}), sending to opposite side`);
                        this.sendToOppositeSide(block, x, y);
                        return;
                    }

                    // Check if collision with existing block
                    if (this.grid[nextY][nextX] !== null) {
                        // Place block at current position
                        this.placeBlock(block, x, y);
                        return;
                    }

                    x = nextX;
                    y = nextY;
                }
            }

            addBlockToSide(block, side, position) {
                // Reverse direction for the block entering from opposite side
                const newDirection = (block.direction + 2) % 4;

                console.log(`Block added to ${side} position ${position}, color ${block.color}, new direction ${newDirection}`);

                // Add to FRONT of queue (becomes next shootable block)
                const positionBlocks = this.sideBlocks[side][position];
                if (positionBlocks) {
                    positionBlocks.unshift({
                        color: block.color,
                        direction: newDirection
                    });

                    // Remove last (oldest) block if exceeds limit
                    if (positionBlocks.length > 1 + this.config.M) {
                        positionBlocks.pop();
                    }
                }

                // Grid state has changed - check if any blocks can now move
                setTimeout(() => {
                    this.moveFreedBlocks();
                }, 100);
            }

            placeBlock(block, x, y) {
                console.log(`Placing block at (${x}, ${y}), color: ${block.color}, direction: ${block.direction}`);
                this.grid[y][x] = {
                    color: block.color,
                    direction: block.direction
                };

                // Note: movingBlocks removal is handled by updateMovingBlocks()

                // Check for matches
                setTimeout(() => {
                    this.checkAndRemoveMatches();
                }, 100);
            }

            checkAndRemoveMatches() {
                console.log('=== checkAndRemoveMatches called ===');
                const toRemove = new Set();
                const checked = new Set();

                // Check all blocks on grid
                for (let y = 0; y < this.config.N; y++) {
                    for (let x = 0; x < this.config.N; x++) {
                        const key = `${x},${y}`;
                        if (this.grid[y][x] !== null && !checked.has(key)) {
                            const connected = this.findConnectedBlocks(x, y);

                            // Mark all these blocks as checked
                            connected.forEach(pos => checked.add(`${pos.x},${pos.y}`));

                            // Only remove if we have Y or more connected blocks
                            if (connected.length >= this.config.Y) {
                                console.log(`Found match: ${connected.length} blocks of color ${this.grid[y][x].color}`, connected);
                                connected.forEach(pos => toRemove.add(`${pos.x},${pos.y}`));
                            }
                        }
                    }
                }

                console.log(`Total blocks to remove: ${toRemove.size}`, Array.from(toRemove));

                if (toRemove.size > 0) {
                    // Animate removal
                    toRemove.forEach(key => {
                        const [x, y] = key.split(',').map(Number);
                        this.animatingBlocks.push({
                            x, y,
                            scale: 1,
                            alpha: 1,
                            color: this.grid[y][x].color
                        });
                        this.grid[y][x] = null;
                    });

                    this.score += toRemove.size;
                    this.updateScore();

                    // After animation, check for freed blocks
                    setTimeout(() => {
                        this.animatingBlocks = [];
                        this.moveFreedBlocks();
                    }, 300);
                } else {
                    // No matches, but grid state may have changed - check for freed blocks
                    this.moveFreedBlocks();
                }
            }

            findConnectedBlocks(startX, startY) {
                const block = this.grid[startY][startX];
                if (!block) return [];

                const color = block.color;
                const connected = [];
                const visited = new Set();
                const queue = [{x: startX, y: startY}];

                while (queue.length > 0) {
                    const {x, y} = queue.shift();
                    const key = `${x},${y}`;

                    if (visited.has(key)) continue;
                    visited.add(key);

                    if (x < 0 || x >= this.config.N || y < 0 || y >= this.config.N) continue;
                    if (this.grid[y][x] === null || this.grid[y][x].color !== color) continue;

                    connected.push({x, y});

                    // Check horizontal and vertical neighbors only (no diagonals)
                    queue.push({x: x + 1, y});
                    queue.push({x: x - 1, y});
                    queue.push({x, y: y + 1});
                    queue.push({x, y: y - 1});
                }

                return connected;
            }

            moveFreedBlocks() {
                console.log('=== moveFreedBlocks called ===');
                const blocksToMove = [];
                const targetPositions = new Map(); // Track where blocks want to move

                // Direction priorities: DOWN (1) > LEFT (2) > UP (3) > RIGHT (0 = lowest)
                const directionPriority = {
                    1: 1, // down - highest priority
                    2: 2, // left
                    3: 3, // up
                    0: 4  // right - lowest priority
                };

                // Find all blocks that can move and track their targets
                for (let y = 0; y < this.config.N; y++) {
                    for (let x = 0; x < this.config.N; x++) {
                        if (this.grid[y][x] !== null) {
                            // Skip static blocks (direction === null)
                            if (this.grid[y][x].direction === null) {
                                continue;
                            }

                            const dir = this.directionVectors[this.grid[y][x].direction];
                            const nextX = x + dir.dx;
                            const nextY = y + dir.dy;

                            // Check if can move
                            if (nextX >= 0 && nextX < this.config.N &&
                                nextY >= 0 && nextY < this.config.N &&
                                this.grid[nextY][nextX] === null) {

                                const targetKey = `${nextX},${nextY}`;

                                // Track which blocks want to move to this target
                                if (!targetPositions.has(targetKey)) {
                                    targetPositions.set(targetKey, []);
                                }
                                targetPositions.get(targetKey).push({x, y, block: this.grid[y][x]});
                            }
                        }
                    }
                }

                // Resolve conflicts using priority system
                for (const [targetKey, blockList] of targetPositions.entries()) {
                    if (blockList.length === 1) {
                        // No conflict, move the block
                        blocksToMove.push(blockList[0]);
                    } else {
                        // Conflict: pick the block with highest priority (lowest priority number)
                        blockList.sort((a, b) => {
                            const priorityA = directionPriority[a.block.direction];
                            const priorityB = directionPriority[b.block.direction];
                            return priorityA - priorityB;
                        });

                        const winner = blockList[0];
                        console.log(`Collision at ${targetKey}: ${blockList.length} blocks, winner: direction ${winner.block.direction} (priority ${directionPriority[winner.block.direction]})`);
                        blocksToMove.push(winner);
                    }
                }

                console.log(`Found ${blocksToMove.length} blocks that can move`, blocksToMove.map(b => `(${b.x},${b.y}) color:${b.block.color} dir:${b.block.direction}`));

                if (blocksToMove.length > 0) {
                    // Move all freed blocks
                    blocksToMove.forEach(({x, y, block}) => {
                        this.grid[y][x] = null;

                        const movingBlock = {
                            color: block.color,
                            direction: block.direction,
                            x: x,
                            y: y,
                            visualX: x,
                            visualY: y,
                            path: [],
                            pathIndex: 0,
                            speed: 0.2,
                            moving: true
                        };

                        this.movingBlocks.push(movingBlock);
                        this.calculateBlockPath(movingBlock);
                    });

                    // Check for matches again after a delay
                    setTimeout(() => {
                        if (this.movingBlocks.length === 0) {
                            this.checkAndRemoveMatches();
                        }
                    }, 200);
                } else {
                    this.checkWinCondition();
                }
            }

            checkWinCondition() {
                // Check if grid is empty
                let isEmpty = true;
                for (let y = 0; y < this.config.N; y++) {
                    for (let x = 0; x < this.config.N; x++) {
                        if (this.grid[y][x] !== null) {
                            isEmpty = false;
                            break;
                        }
                    }
                    if (!isEmpty) break;
                }

                if (isEmpty) {
                    document.getElementById('finalScore').textContent = this.score;
                    document.getElementById('winMessage').classList.add('show');
                }
            }

            updateScore() {
                document.getElementById('scoreValue').textContent = this.score;

                // Update high score if current score exceeds it
                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    this.saveHighScore();
                    this.updateHighScoreDisplay();
                }
            }

            draw() {
                // Clear canvas with appropriate background
                const isDark = document.body.classList.contains('dark-mode');
                this.ctx.fillStyle = isDark ? '#1a1a2e' : '#f5f5f5';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw grid
                this.drawGrid();

                // Draw blocks on grid
                this.drawGridBlocks();

                // Draw trajectory preview (behind side blocks)
                this.drawTrajectoryPreview();

                // Draw side blocks
                this.drawSideBlocks();

                // Draw moving blocks
                this.drawMovingBlocks();

                // Draw animating blocks
                this.drawAnimatingBlocks();
            }

            drawGrid() {
                const isDark = document.body.classList.contains('dark-mode');
                this.ctx.strokeStyle = isDark ? '#333' : '#ddd';
                this.ctx.lineWidth = 1;

                for (let y = 0; y <= this.config.N; y++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.gridOffsetX, this.gridOffsetY + y * this.CELL_SIZE);
                    this.ctx.lineTo(this.gridOffsetX + this.config.N * this.CELL_SIZE, this.gridOffsetY + y * this.CELL_SIZE);
                    this.ctx.stroke();
                }

                for (let x = 0; x <= this.config.N; x++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(this.gridOffsetX + x * this.CELL_SIZE, this.gridOffsetY);
                    this.ctx.lineTo(this.gridOffsetX + x * this.CELL_SIZE, this.gridOffsetY + this.config.N * this.CELL_SIZE);
                    this.ctx.stroke();
                }
            }

            drawGridBlocks() {
                for (let y = 0; y < this.config.N; y++) {
                    for (let x = 0; x < this.config.N; x++) {
                        if (this.grid[y][x] !== null) {
                            this.drawBlock(
                                this.gridOffsetX + x * this.CELL_SIZE,
                                this.gridOffsetY + y * this.CELL_SIZE,
                                this.grid[y][x].color,
                                this.grid[y][x].direction
                            );
                        }
                    }
                }
            }

            drawSideBlocks() {
                const sides = ['left', 'up', 'right', 'down'];

                sides.forEach(side => {
                    const positions = this.sideBlocks[side];

                    // For each position (row/column)
                    for (let i = 0; i < positions.length; i++) {
                        const positionBlocks = positions[i];

                        // Draw all blocks at this position (shootable + waiting)
                        for (let depth = 0; depth < positionBlocks.length; depth++) {
                            const pos = this.getSideBlockPosition(side, i, depth);
                            const block = positionBlocks[depth];

                            // Only the shootable block (depth 0) can be hovered or active
                            const isHovered = depth === 0 && this.hoveredBlock &&
                                            this.hoveredBlock.side === side &&
                                            this.hoveredBlock.position === i;

                            const isActive = depth === 0 && this.activeBlock &&
                                           this.activeBlock.side === side &&
                                           this.activeBlock.position === i;

                            // Determine if arrow should be grayed
                            // - Waiting blocks (depth > 0): grayed
                            // - Shootable blocks that can't hit anything: grayed
                            const canShoot = depth === 0 && this.willBlockHitAnything(side, i);
                            const grayedArrow = !canShoot;

                            this.drawBlock(pos.x, pos.y, block.color, block.direction, isHovered, grayedArrow, isActive);
                        }
                    }
                });
            }

            drawMovingBlocks() {
                // Moving blocks are drawn using visualX/visualY for smooth animation
                this.movingBlocks.forEach(block => {
                    this.drawBlock(
                        this.gridOffsetX + block.visualX * this.CELL_SIZE,
                        this.gridOffsetY + block.visualY * this.CELL_SIZE,
                        block.color,
                        block.direction
                    );
                });
            }

            drawAnimatingBlocks() {
                this.animatingBlocks.forEach(anim => {
                    const x = this.gridOffsetX + anim.x * this.CELL_SIZE;
                    const y = this.gridOffsetY + anim.y * this.CELL_SIZE;

                    this.ctx.save();
                    this.ctx.globalAlpha = anim.alpha;
                    this.ctx.translate(x + this.CELL_SIZE / 2, y + this.CELL_SIZE / 2);
                    this.ctx.scale(anim.scale, anim.scale);
                    this.ctx.translate(-this.CELL_SIZE / 2, -this.CELL_SIZE / 2);

                    this.ctx.fillStyle = this.colors[anim.color];
                    this.ctx.fillRect(
                        this.BLOCK_MARGIN,
                        this.BLOCK_MARGIN,
                        this.CELL_SIZE - this.BLOCK_MARGIN * 2,
                        this.CELL_SIZE - this.BLOCK_MARGIN * 2
                    );

                    this.ctx.restore();

                    // Update animation
                    anim.scale += 0.05;
                    anim.alpha -= 0.05;
                });

                // Remove finished animations
                this.animatingBlocks = this.animatingBlocks.filter(anim => anim.alpha > 0);
            }

            drawTrajectoryPreview() {
                if (!this.trajectoryPreview || this.trajectoryPreview.length === 0 || !this.activeBlock) {
                    return;
                }

                // Get the active block's color
                const block = this.sideBlocks[this.activeBlock.side][this.activeBlock.position][0];
                const blockColor = this.colors[block.color];

                this.ctx.save();

                // Use the block's color with good opacity for visibility
                this.ctx.strokeStyle = blockColor;
                this.ctx.globalAlpha = 0.7;
                this.ctx.lineWidth = 4;
                this.ctx.setLineDash([8, 8]);

                // Draw dotted line through the path
                this.ctx.beginPath();
                this.trajectoryPreview.forEach((pos, index) => {
                    const x = this.gridOffsetX + pos.x * this.CELL_SIZE + this.CELL_SIZE / 2;
                    const y = this.gridOffsetY + pos.y * this.CELL_SIZE + this.CELL_SIZE / 2;

                    if (index === 0) {
                        this.ctx.moveTo(x, y);
                    } else {
                        this.ctx.lineTo(x, y);
                    }
                });
                this.ctx.stroke();

                // Draw small circles at each position
                this.ctx.fillStyle = blockColor;
                this.ctx.globalAlpha = 0.6;
                this.trajectoryPreview.forEach(pos => {
                    const x = this.gridOffsetX + pos.x * this.CELL_SIZE + this.CELL_SIZE / 2;
                    const y = this.gridOffsetY + pos.y * this.CELL_SIZE + this.CELL_SIZE / 2;

                    this.ctx.beginPath();
                    this.ctx.arc(x, y, 5, 0, Math.PI * 2);
                    this.ctx.fill();
                });

                this.ctx.restore();
            }

            drawBlock(x, y, colorIndex, direction, isHovered = false, grayedArrow = false, isActive = false) {
                this.ctx.save();

                // Apply scale and glow for active block
                if (isActive) {
                    const scale = 1.15;
                    const centerX = x + this.CELL_SIZE / 2;
                    const centerY = y + this.CELL_SIZE / 2;

                    // Apply scale transform
                    this.ctx.translate(centerX, centerY);
                    this.ctx.scale(scale, scale);
                    this.ctx.translate(-centerX, -centerY);

                    // Add glowing effect
                    this.ctx.shadowColor = this.colors[colorIndex];
                    this.ctx.shadowBlur = 20;
                }

                // Draw block
                this.ctx.fillStyle = this.colors[colorIndex];

                if (isHovered && !isActive) {
                    this.ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                    this.ctx.shadowBlur = 10;
                }

                this.ctx.fillRect(
                    x + this.BLOCK_MARGIN,
                    y + this.BLOCK_MARGIN,
                    this.CELL_SIZE - this.BLOCK_MARGIN * 2,
                    this.CELL_SIZE - this.BLOCK_MARGIN * 2
                );

                this.ctx.shadowBlur = 0;

                // Draw direction indicator (only if direction is not null)
                this.drawDirectionArrow(x, y, direction, grayedArrow);

                this.ctx.restore();
            }

            drawDirectionArrow(x, y, direction, grayed = false) {
                // Don't draw arrow for static blocks (direction === null)
                if (direction === null) return;

                const centerX = x + this.CELL_SIZE / 2;
                const centerY = y + this.CELL_SIZE / 2;
                const size = 6;

                // Gray out arrow for non-shootable blocks
                this.ctx.fillStyle = grayed ? 'rgba(128, 128, 128, 0.5)' : 'rgba(255, 255, 255, 0.7)';
                this.ctx.beginPath();

                switch(direction) {
                    case 0: // right
                        this.ctx.moveTo(centerX - size, centerY - size);
                        this.ctx.lineTo(centerX + size, centerY);
                        this.ctx.lineTo(centerX - size, centerY + size);
                        break;
                    case 1: // down
                        this.ctx.moveTo(centerX - size, centerY - size);
                        this.ctx.lineTo(centerX, centerY + size);
                        this.ctx.lineTo(centerX + size, centerY - size);
                        break;
                    case 2: // left
                        this.ctx.moveTo(centerX + size, centerY - size);
                        this.ctx.lineTo(centerX - size, centerY);
                        this.ctx.lineTo(centerX + size, centerY + size);
                        break;
                    case 3: // up
                        this.ctx.moveTo(centerX - size, centerY + size);
                        this.ctx.lineTo(centerX, centerY - size);
                        this.ctx.lineTo(centerX + size, centerY + size);
                        break;
                }

                this.ctx.closePath();
                this.ctx.fill();
            }

            updateMovingBlocks() {
                const blocksToRemove = [];

                this.movingBlocks.forEach((block, index) => {
                    if (block.path && block.path.length > 0) {
                        // Get current target position
                        const target = block.path[block.pathIndex];

                        // Move towards target
                        const dx = target.x - block.visualX;
                        const dy = target.y - block.visualY;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < block.speed) {
                            // Reached target, move to next point in path
                            block.visualX = target.x;
                            block.visualY = target.y;
                            block.pathIndex++;

                            if (block.pathIndex >= block.path.length) {
                                // Reached end of path
                                block.x = block.finalX;
                                block.y = block.finalY;

                                if (block.endsAtEdge) {
                                    // Block has animated to side position, now add to queue
                                    this.addBlockToSide(block, block.destinationSide, block.destinationPosition);
                                } else {
                                    this.placeBlock(block, block.finalX, block.finalY);
                                }
                                blocksToRemove.push(index);
                            }
                        } else {
                            // Move towards target
                            block.visualX += (dx / distance) * block.speed;
                            block.visualY += (dy / distance) * block.speed;
                        }
                    }
                });

                // Remove blocks that finished moving (in reverse to preserve indices)
                for (let i = blocksToRemove.length - 1; i >= 0; i--) {
                    const idx = this.movingBlocks.indexOf(this.movingBlocks[blocksToRemove[i]]);
                    if (idx > -1) {
                        this.movingBlocks.splice(idx, 1);
                    }
                }
            }

            animate() {
                this.updateMovingBlocks();
                this.draw();
                requestAnimationFrame(() => this.animate());
            }
        }

        // Initialize game
        const game = new BlockShooterGame();
    </script>

    <!-- Service Worker Registration & Update Management -->
    <script>
        let waitingServiceWorker = null;
        let registration = null;

        // Update debug info
        function updateDebugInfo(message) {
            const debug = document.getElementById('debugInfo');
            if (debug) {
                const timestamp = new Date().toLocaleTimeString();
                debug.innerHTML = `${message}<br><small>Last updated: ${timestamp}</small>`;
            }
        }

        // Manual update check
        function manualUpdateCheck() {
            updateDebugInfo('🔄 Checking for updates...');
            if (registration) {
                registration.update().then(() => {
                    setTimeout(() => {
                        if (waitingServiceWorker) {
                            updateDebugInfo('✅ Update available! Look for banner below.');
                        } else {
                            updateDebugInfo('✅ You have the latest version (v1.2)');
                        }
                    }, 1000);
                });
            } else {
                updateDebugInfo('❌ Service Worker not registered');
            }
        }

        // Show update notification
        function showUpdateNotification() {
            const notification = document.getElementById('updateNotification');
            notification.classList.add('show');
            updateDebugInfo('🎉 Update available! See banner below.');
            console.log('Tegel PWA: Update available!');
        }

        // Update app - activate the waiting service worker
        function updateApp() {
            if (waitingServiceWorker) {
                console.log('Tegel PWA: Updating to new version...');
                waitingServiceWorker.postMessage({ type: 'SKIP_WAITING' });

                // Hide notification
                const notification = document.getElementById('updateNotification');
                notification.classList.remove('show');
            }
        }

        // Dismiss update notification
        function dismissUpdate() {
            const notification = document.getElementById('updateNotification');
            notification.classList.remove('show');
            console.log('Tegel PWA: Update dismissed');
        }

        // Register service worker for PWA functionality
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => {
                        registration = reg; // Store for later use
                        console.log('Tegel PWA: Service Worker registered successfully!', reg.scope);
                        console.log('Tegel PWA: You can now install this app!');

                        updateDebugInfo('✅ Service Worker registered. Checking for updates...');

                        // Check for updates every time the app is opened
                        registration.update();

                        // Listen for waiting service worker (new version available)
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            console.log('Tegel PWA: New version found, installing...');

                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // New service worker available
                                    waitingServiceWorker = newWorker;
                                    showUpdateNotification();
                                }
                            });
                        });

                        // Handle updates from a waiting service worker
                        if (registration.waiting) {
                            waitingServiceWorker = registration.waiting;
                            showUpdateNotification();
                        } else {
                            // No update waiting
                            setTimeout(() => {
                                if (!waitingServiceWorker) {
                                    updateDebugInfo('✅ No updates available. Running v1.2');
                                }
                            }, 2000);
                        }
                    })
                    .catch((error) => {
                        console.error('Tegel PWA: Service Worker registration failed:', error);
                        updateDebugInfo('❌ Service Worker registration failed');
                    });

                // Reload the page when the new service worker takes control
                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!refreshing) {
                        refreshing = true;
                        console.log('Tegel PWA: Reloading with new version...');
                        window.location.reload();
                    }
                });
            });

            // Listen for install prompt
            let deferredPrompt;
            window.addEventListener('beforeinstallprompt', (e) => {
                console.log('Tegel PWA: Install prompt available!');
                deferredPrompt = e;
            });

            // Check if app is already installed
            window.addEventListener('appinstalled', () => {
                console.log('Tegel PWA: App installed successfully!');
            });
        } else {
            console.log('Tegel PWA: Service Workers not supported in this browser');
            updateDebugInfo('❌ Service Workers not supported in this browser');
        }

        // Initial status
        setTimeout(() => {
            if (!registration) {
                updateDebugInfo('⏳ Waiting for Service Worker to register...');
            }
        }, 100);
    </script>
</body>
</html>
